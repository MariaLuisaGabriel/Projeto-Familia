[project]
name = "estudos"
version = "0.3.0"
description = "Plataforma de estudos customizável por templates de área"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<6",
    "django-allauth>=65.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "jsonschema>=4.23",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.390",
    "django-types>=0.20",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "hypothesis>=6.120",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/estudos"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# Markdown fica de fora: o ruff formataria os blocos de código da documentação.
# Migrações são geradas pelo Django.
extend-exclude = ["docs", "*.md", "**/migrations"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplificações
    "DJ",           # django
    "S",            # bandit (segurança)
    "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # acentos em strings e comentários em português
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"src/estudos/**/tests/**" = ["S101", "S106"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/migrations", ".venv"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# Domínio e núcleo são Python puro: checagem estrita.
strict = ["src/estudos/core", "src/estudos/modules/*/domain"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "estudos.config.settings.test"
pythonpath = ["src"]
testpaths = ["tests", "src"]
addopts = "--strict-markers -ra"

# ---------------------------------------------------------------- import-linter
# Fronteiras da ARQUITETURA §4.3 (R-01 a R-06). A matriz entre módulos (R-03, R-05)
# é verificada por tests/architecture/test_module_matrix.py.
[tool.importlinter]
root_package = "estudos"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain e core não dependem de infraestrutura (R-01)"
type = "forbidden"
source_modules = ["estudos.core", "estudos.modules.*.domain"]
forbidden_modules = ["django", "allauth", "procrastinate"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "camadas dentro de cada módulo (R-01, R-02)"
type = "layers"
# Cada módulo novo entra nesta lista no mesmo PR que o cria.
containers = [
    "estudos.modules.identity",
]
layers = ["(views)", "(api)", "(services)", "(models)", "(domain)"]

[[tool.importlinter.contracts]]
name = "pacotes compartilhados não dependem de módulos (R-06)"
type = "forbidden"
source_modules = ["estudos.core", "estudos.registries", "estudos.template_schema"]
forbidden_modules = ["estudos.modules"]
