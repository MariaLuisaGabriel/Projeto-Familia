name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: estudos
          POSTGRES_USER: estudos
          POSTGRES_PASSWORD: estudos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estudos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DJANGO_SETTINGS_MODULE: estudos.config.settings.test
      POSTGRES_HOST: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tipos (pyright)
        run: uv run pyright

      - name: Fronteiras (import-linter, R-01 a R-06)
        run: uv run lint-imports

      - name: Checks do Django e migrações pendentes
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Testes (inclui fitness functions em tests/architecture)
        run: uv run pytest
